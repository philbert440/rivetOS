# Single Agent — Simplest setup
#
# One agent, one provider. Chat via RivetHub / gateway.
# Copy to config.yaml and fill in your values.

runtime:
  workspace: ./workspace
  default_agent: assistant

agents:
  assistant:
    provider: anthropic
    default_thinking: medium

providers:
  anthropic:
    model: claude-sonnet-4-6
    max_tokens: 8192
    # API key via env: ANTHROPIC_API_KEY

# Channels: social bots (telegram/discord/voice-discord) were removed in Phase 5.
# Human UX is RivetHub (gateway clients). Optional agent mesh:
# channels:
#   agent:
#     port: 3100
#     agent_id: opus
memory:
  postgres:
    # Connection string via env: RIVETOS_PG_URL
