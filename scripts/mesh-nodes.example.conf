# Mesh roster for bootstrap-certs.sh
# Format: <node-id>:<ip>:<agent-id-or-empty>
#   - datahub-style nodes (no agent) leave the third field empty
#   - agents map 1:1 to their host node
#
# IPs below use RFC 5737 documentation ranges. Replace with your real mesh IPs
# in /rivet-shared/rivet-ca/mesh-nodes.conf (NFS, untracked) or
# scripts/mesh-nodes.conf (local, gitignored).

node-a:192.0.2.10:
node-b:192.0.2.11:opus
node-c:192.0.2.12:grok
node-d:192.0.2.13:gemini
node-e:192.0.2.14:local
