# RivetHub desktop shell (phase 4j) — deliberately outside the nx/npm build
# graph's critical path: Gradle-style colocated Rust, built where a desktop
# lives (phildesk), not in CI.
[package]
name = "rivethub-desktop"
version = "0.4.0"
description = "RivetHub desktop — thin Tauri shell over rivethub-web"
edition = "2021"

[lib]
name = "rivethub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gateway mTLS bridge (#491): loopback byte-pipes wrapping gateway
# connections in TLS with the device client cert (see src/proxy.rs).
tokio = { version = "1", features = ["net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
