# kitty.conf

font_family      family="FiraCode Nerd Font" style=Regular
bold_font        auto
italic_font      auto
font_size        12.0
adjust_line_height 110%

scrollback_lines 10000
enable_audio_bell no
copy_on_select yes

# BEGIN_KITTY_THEME
include ./current-theme.conf
# END_KITTY_THEME

map ctrl+shift+enter new_window
