<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>RivetHub</title>
    <script>
      // Pre-paint theme boot — mirrors src/lib/theme.ts (rivethub.theme =
      // light | dark | system | omarchy, default system) so the first frame
      // already has the right token set; stores/theme.ts re-applies and
      // tracks changes. Omarchy tokens arrive a frame later from the store.
      ;(function () {
        var pref = localStorage.getItem('rivethub.theme')
        var dark
        var themeColor
        if (pref === 'omarchy') {
          try {
            var snap = JSON.parse(localStorage.getItem('rivethub.omarchy-theme') || 'null')
            var colors = snap && snap.colors
            var mode = colors && colors.mode
            if (mode === 'light' || mode === 'dark') {
              dark = mode === 'dark'
            } else {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches
            }
            var bg = colors && colors.background
            if (typeof bg === 'string' && /^#[0-9a-f]{6}$/i.test(bg)) {
              themeColor = bg
            }
          } catch (e) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          }
        } else {
          dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', themeColor || (dark ? '#0d1117' : '#f6f4ee'))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
