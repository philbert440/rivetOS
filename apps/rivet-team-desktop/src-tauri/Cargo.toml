# rivet-team desktop — thin Tauri 2 shell over rivet-team-web.
# Same posture as rivethub-desktop: built where a desktop lives, not in CI.
# No tray / notifications / mTLS pipe this slice (those are Hub chrome).
[package]
name = "rivet-team-desktop"
version = "0.1.0"
description = "rivet-team desktop — thin Tauri shell over rivet-team-web"
edition = "2021"

[lib]
name = "rivet_team_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
