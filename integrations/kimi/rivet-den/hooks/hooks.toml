# RivetOS rivet-den hooks for Kimi Code CLI.
# Append this fragment into $KIMI_CODE_HOME/config.toml (or ~/.kimi-code/config.toml).
#
# Twelve of kimi's twenty hook events are wired — the eight that carry nothing
# the den can draw are deliberately left out so their hooks never even start
# (SessionHeartbeat in particular only ticks its 60s timer when something is
# subscribed to it). See README § Event mapping for why each one is out.
#
# Timeout 8s, matching the sibling rivet-memory hooks; the launcher always
# exits 0. Paths below use /opt/rivetos — rewrite them if RIVETOS_ROOT differs.
# These commands differ from the rivet-memory ones, so both integrations can
# share the same events (kimi dedupes per event by exact command string).

[[hooks]]
event = "SessionStart"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh SessionStart"
timeout = 8

[[hooks]]
event = "SessionEnd"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh SessionEnd"
timeout = 8

[[hooks]]
event = "UserPromptSubmit"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh UserPromptSubmit"
timeout = 8

[[hooks]]
event = "TurnStarted"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh TurnStarted"
timeout = 8

[[hooks]]
event = "PreToolUse"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh PreToolUse"
timeout = 8

[[hooks]]
event = "PostToolUse"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh PostToolUse"
timeout = 8

[[hooks]]
event = "PostToolUseFailure"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh PostToolUseFailure"
timeout = 8

[[hooks]]
event = "Stop"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh Stop"
timeout = 8

[[hooks]]
event = "StopFailure"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh StopFailure"
timeout = 8

[[hooks]]
event = "Interrupt"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh Interrupt"
timeout = 8

[[hooks]]
event = "PreCompact"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh PreCompact"
timeout = 8

[[hooks]]
event = "PostCompact"
command = "/opt/rivetos/integrations/kimi/rivet-den/bin/kimi-den-hook.sh PostCompact"
timeout = 8
