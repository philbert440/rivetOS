id: change
version: "0.1.0"
name: Change
description: >
  Feature/bug change workflow: plan → human plan gate → implement (open PR) →
  call pr-review (up to 3 rounds with fixup) → human merge gate → optional squash merge.
input:
  - name: kind
    type: string
    required: true
    description: "feature | bug"
  - name: title
    type: string
    required: true
    description: Short change title
  - name: goal
    type: string
    required: true
    description: Acceptance criteria or bug repro
  - name: repo
    type: string
    required: true
    description: "GitHub repository as owner/name"
  - name: base
    type: string
    required: false
    description: Base branch (default main, applied in run.ts)
output:
  - name: pr
    type: string
    required: false
    description: Pull request URL when one was opened
  - name: merged
    type: boolean
    required: false
    description: Whether the PR was merged
  - name: summary
    type: string
    description: Final outcome summary
outline:
  - id: understand
    kind: agent
    label: Understand
    description: Planner produces PLAN.md
  - id: plan-gate
    kind: human
    label: Plan gate
    description: Human approves the plan
  - id: implement
    kind: agent
    label: Implement
    description: Implementer opens a PR
  - id: review-loop
    kind: call
    label: Review loop
    description: step.call pr-review up to 3 times with fixups
  - id: merge-gate
    kind: human
    label: Merge gate
    description: Human decides whether to merge
  - id: merge
    kind: run
    label: Merge
    description: gh pr merge --squash (when approved)
  - id: done
    kind: done
    label: Done
budgets:
  maxTokens: 800000
