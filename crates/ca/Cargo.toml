[package]
name = "ca"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ca"
path = "src/lib.rs"

[[bin]]
name = "rivet-ca"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
p12-keystore = "0.4.0"
rand = "0.8"
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
signature = { version = "3", features = ["alloc"] }
thiserror.workspace = true
tracing = "0.1.44"
x509-cert = { version = "0.3.0", features = ["builder", "pem", "std"] }
x509-parser = "0.18.1"

[lints]
workspace = true
