[package]
name = "skills"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
indexmap = "2.11.4"
protocol = { path = "../protocol" }
regex = "1.11.1"
regress = "0.12.0"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
schemars = "0.8.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tools = { path = "../tools" }
tracing = "0.1.41"

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
