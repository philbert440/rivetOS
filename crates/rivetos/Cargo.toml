[package]
name = "rivetos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rivetos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
memory = { path = "../memory" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
