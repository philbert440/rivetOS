[package]
name = "local-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "local-db"
path = "src/bin/local-db.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = { path = "../config" }
postgresql_embedded = { version = "0.21", default-features = false, features = ["tokio", "theseus", "tls-rustls-ring"] }
postgresql_extensions = { version = "0.21", default-features = false, features = ["tokio", "portal-corp", "tls-rustls-ring"] }
protocol = { path = "../protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[lints]
workspace = true
