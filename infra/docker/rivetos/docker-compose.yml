# RivetOS Unified Stack — single-host deployment.
#
# One image: `rivetos:latest`. Datahub uses upstream `pgvector/pgvector:pg16`
# directly — schema is applied by the `migrate` service (--role migrate) on
# every stack start.
#
# Quick start (from repo root):
#
#   docker compose -f infra/docker/rivetos/docker-compose.yml up --build
#
# Services:
#   - datahub:            upstream Postgres 16 + pgvector (no custom image)
#   - migrate:            applies pending migrations on each stack start
#                         (`rivetos start --role migrate`)
#   - embedding-worker:   graphile-worker pump that embeds new rows
#   - compaction-worker:  graphile-worker pump that summarizes conversations
#   - agent:              the runtime that drives channels + providers
#                         (`rivetos start --role agent`; needs config)
#
# Only `migrate` and `agent` are CLI roles. The two workers are standalone
# node processes shipped in the same image — there is no `--role worker`.
#
# Both workers sit behind the `workers` profile, so a plain `up` skips them.
# Each needs an inference endpoint *and* a model id this file cannot guess
# (RIVETOS_EMBED_URL + RIVETOS_EMBED_MODEL / RIVETOS_COMPACTOR_URL +
# RIVETOS_COMPACTOR_MODEL) and exits on boot without either. There is no
# silent model default. Point them at your hosts, then:
#   docker compose -f infra/docker/rivetos/docker-compose.yml \
#     --profile workers up
#
# The `agent` service expects ~/.rivetos to exist on the host with config.yaml
# and .env. Run `rivetos init` first to generate them. Agent memory/embed
# config comes from that mounted .env (templates set both URL and model);
# this compose file does not inject embed vars into the agent service.
#
# Tear down (preserve DB):
#   docker compose -f infra/docker/rivetos/docker-compose.yml down
# Tear down + wipe DB:
#   docker compose -f infra/docker/rivetos/docker-compose.yml down -v

services:
  datahub:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rivetos
      POSTGRES_PASSWORD: rivetos
      POSTGRES_DB: rivetos
    volumes:
      - rivetos-pgdata:/var/lib/postgresql/data
    networks:
      - rivetos-net
    ports:
      - '5433:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rivetos -d rivetos']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ../../..
      dockerfile: infra/containers/rivetos/Dockerfile
    image: rivetos:latest
    command: ['node', 'dist/rivetos.js', 'start', '--role', 'migrate']
    environment:
      RIVETOS_PG_URL: postgres://rivetos:rivetos@datahub:5432/rivetos
      # Also tells the image's inline HEALTHCHECK to skip — it keys off
      # RIVETOS_ROLE, not the --role flag.
      RIVETOS_ROLE: migrate
    depends_on:
      datahub:
        condition: service_healthy
    networks:
      - rivetos-net
    restart: 'no'

  # services/embedding-worker — standalone graphile-worker process, not a CLI
  # role. Requires RIVETOS_EMBED_URL and RIVETOS_EMBED_MODEL; exits on boot
  # without either. No silent model default.
  embedding-worker:
    profiles: ['workers']
    build:
      context: ../../..
      dockerfile: infra/containers/rivetos/Dockerfile
    image: rivetos:latest
    command: ['node', 'services/embedding-worker/dist/index.js']
    environment:
      RIVETOS_PG_URL: postgres://rivetos:rivetos@datahub:5432/rivetos
      # e.g. RIVETOS_EMBED_URL=http://gpu-host:9401 and
      # RIVETOS_EMBED_MODEL=text-embedding-3-small in the shell or a .env file
      # next to this compose file. Left empty the worker logs
      # "[EmbedWorker] RIVETOS_EMBED_URL is required" (or MODEL) and exits 1.
      RIVETOS_EMBED_URL: ${RIVETOS_EMBED_URL:-}
      RIVETOS_EMBED_MODEL: ${RIVETOS_EMBED_MODEL:-}
    # The image healthcheck probes the agent's HTTP port, which this process
    # does not open.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - rivetos-net
    restart: unless-stopped

  # services/compaction-worker — standalone graphile-worker process, not a CLI
  # role. Requires RIVETOS_COMPACTOR_URL and RIVETOS_COMPACTOR_MODEL; exits
  # on boot without either. No silent model default.
  compaction-worker:
    profiles: ['workers']
    build:
      context: ../../..
      dockerfile: infra/containers/rivetos/Dockerfile
    image: rivetos:latest
    command: ['node', 'services/compaction-worker/dist/index.js']
    environment:
      RIVETOS_PG_URL: postgres://rivetos:rivetos@datahub:5432/rivetos
      # OpenAI-compatible base URL — the worker appends /chat/completions.
      # e.g. RIVETOS_COMPACTOR_URL=http://llm-host:8003/v1 and
      # RIVETOS_COMPACTOR_MODEL=gpt-4o-mini. Left empty the worker logs
      # "[CompactWorker] RIVETOS_COMPACTOR_URL is required" (or MODEL) and
      # exits 1.
      RIVETOS_COMPACTOR_URL: ${RIVETOS_COMPACTOR_URL:-}
      RIVETOS_COMPACTOR_MODEL: ${RIVETOS_COMPACTOR_MODEL:-}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - rivetos-net
    restart: unless-stopped

  agent:
    build:
      context: ../../..
      dockerfile: infra/containers/rivetos/Dockerfile
    image: rivetos:latest
    command: ['node', 'dist/rivetos.js', 'start', '--role', 'agent']
    environment:
      RIVETOS_PG_URL: postgres://rivetos:rivetos@datahub:5432/rivetos
      RIVETOS_HEALTH_PORT: '3100'
    volumes:
      # Bring in the user's config + secrets. Read-only by default; the
      # runtime writes only to /home/rivetos/.rivetos/workspace inside the
      # container, which is unmounted (ephemeral).
      - ${HOME}/.rivetos/config.yaml:/home/rivetos/.rivetos/config.yaml:ro
      - ${HOME}/.rivetos/.env:/home/rivetos/.rivetos/.env:ro
      # Optional: mount a host skill dir to share skills.
      # - ${HOME}/.rivetos/skills:/home/rivetos/.rivetos/workspace/skills:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - rivetos-net
    ports:
      - '3100:3100'
    restart: unless-stopped

volumes:
  rivetos-pgdata:
    name: rivetos-pgdata

networks:
  rivetos-net:
    name: rivetos-net
    driver: bridge
