runtime:
  workspace: ~/.rivetos/workspace
  default_agent: %%AGENT_NAME%%
  turn_timeout: 900
  skill_dirs:
    - /opt/rivetos/skills
  heartbeats:
    - agent: %%AGENT_NAME%%
      schedule: '0 */4 * * *'
      timezone: America/New_York
      prompt: Read HEARTBEAT.md if it exists. Follow it. If nothing needs attention, reply HEARTBEAT_OK.
agents:
  %%AGENT_NAME%%:
    provider: ollama
    default_thinking: off
    local: true
providers:
  ollama:
    model: %%DEFAULT_MODEL%%
    base_url: %%BASE_URL%%
    max_tokens: 4096
    temperature: 0.6
    # Context window size for /context stats and compaction thresholds.
    # Match what your Ollama daemon advertises for the chosen model.
    context_window: 32000

# Channels: social bots (telegram/discord/voice-discord) were removed in Phase 5.
# Human UX is RivetHub (gateway clients). Optional agent mesh:
# channels:
#   agent:
#     port: 3100
#     agent_id: opus
memory:
  postgres:
    connection_string: ${RIVETOS_PG_URL}
    embed_endpoint: ${RIVETOS_EMBED_URL}
    embed_model: ${RIVETOS_EMBED_MODEL}
    compactor_endpoint: https://api.x.ai/v1
    compactor_model: grok-4-1-fast-reasoning
    compactor_api_key: ${XAI_API_KEY}
