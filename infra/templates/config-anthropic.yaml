runtime:
  workspace: ~/.rivetos/workspace
  default_agent: %%AGENT_NAME%%
  turn_timeout: 900
  skill_dirs:
    - /opt/rivetos/skills
  heartbeats:
    - agent: %%AGENT_NAME%%
      schedule: '0 8,20 * * *'
      timezone: America/New_York
      prompt: >-
        Heartbeat check. Read HEARTBEAT.md if it exists and follow it strictly.
        Check email, calendar, weather, and anything notable. Summarize findings.
        If nothing needs attention, reply HEARTBEAT_OK.
agents:
  %%AGENT_NAME%%:
    provider: anthropic
    default_thinking: medium
  grok:
    provider: xai
    default_thinking: medium
  gemini:
    provider: google
    default_thinking: medium
providers:
  anthropic:
    model: %%DEFAULT_MODEL%%
    max_tokens: 8192
  xai:
    model: grok-4.20-reasoning
    max_tokens: 8192
  google:
    model: gemini-2.5-pro
    max_tokens: 8192

# Channels: social bots (telegram/discord/voice-discord) were removed in Phase 5.
# Human UX is RivetHub (gateway clients). Optional agent mesh:
# channels:
#   agent:
#     port: 3100
#     agent_id: opus
memory:
  postgres:
    connection_string: ${RIVETOS_PG_URL}
    embed_endpoint: ${RIVETOS_EMBED_URL}
    embed_model: ${RIVETOS_EMBED_MODEL}
    compactor_endpoint: https://api.x.ai/v1
    compactor_model: grok-4-1-fast-reasoning
    compactor_api_key: ${XAI_API_KEY}
