runtime:
  workspace: ~/.rivetos/workspace
  default_agent: %%AGENT_NAME%%
  turn_timeout: 900
  skill_dirs:
    - /opt/rivetos/skills
  heartbeats:
    - agent: %%AGENT_NAME%%
      schedule: '0 8,20 * * *'
      timezone: America/New_York
      prompt: >-
        Read HEARTBEAT.md if it exists (workspace context). Follow it strictly.
        Do not infer or repeat old tasks from prior chats. If nothing needs attention,
        reply HEARTBEAT_OK.
agents:
  %%AGENT_NAME%%:
    provider: xai
    default_thinking: medium
providers:
  xai:
    model: %%DEFAULT_MODEL%%
    max_tokens: 8192

# Channels: social bots (telegram/discord/voice-discord) were removed in Phase 5.
# Human UX is RivetHub (gateway clients). Optional agent mesh:
# channels:
#   agent:
#     port: 3100
#     agent_id: opus
memory:
  postgres:
    connection_string: ${RIVETOS_PG_URL}
    embed_endpoint: ${RIVETOS_EMBED_URL}
    compactor_endpoint: https://api.x.ai/v1
    compactor_model: grok-4-1-fast-reasoning
    compactor_api_key: ${XAI_API_KEY}
