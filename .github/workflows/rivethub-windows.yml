name: RivetHub Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/rivethub-desktop/src-tauri

      - run: npm ci

      - run: npx nx build @rivetos/rivethub-web

      - run: cargo install tauri-cli --version "^2.0" --locked

      - working-directory: apps/rivethub-desktop
        run: cargo tauri build

      - run: ls -R src-tauri/target/release/bundle
        working-directory: apps/rivethub-desktop
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: rivethub-windows-nsis
          path: apps/rivethub-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
